<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Фото на Индере</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    header {
      padding: 14px 12px 8px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 15px;
      opacity: .85;
    }

    .status {
      min-height: 20px;
      margin-top: 6px;
      color: #93c5fd;
      font-size: 14px;
    }

    .stage-wrap {
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 430px;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 22px;
      background: #111;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video {
      transform: scaleX(-1);
      z-index: 1;
    }

    canvas {
      display: none;
      z-index: 2;
    }

    .top-label {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.9);
      color: #111827;
      padding: 10px 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 18px;
      white-space: nowrap;
      z-index: 5;
    }

    .bottom-label {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,42,.80);
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      z-index: 5;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 16px 12px 22px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      min-width: 150px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .warning {
      background: #f59e0b;
      color: #111827;
    }

    .note {
      max-width: 500px;
      margin: 0 auto 24px;
      padding: 0 16px;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<header>
  <h1>Фото на Индере</h1>
  <div class="subtitle">AR-фотозона проекта Zerde</div>
  <div class="status" id="status">Запускаем камеру...</div>
</header>

<div class="stage-wrap">
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" width="720" height="1280"></canvas>

    <div class="top-label">ИНДЕР · ТҰЗДЫКӨЛ</div>
    <div class="bottom-label">Zerde AR Project</div>
  </div>
</div>

<div class="controls">
  <button class="warning" id="bgBtn">🏞 Включить фон Индер</button>
  <button class="primary" id="captureBtn">📸 Сделать фото</button>
  <button class="success" id="saveBtn" disabled>⬇ Сохранить фото</button>
  <button class="secondary" id="switchBtn">🔄 Сменить камеру</button>
</div>

<div class="note">
  Сначала камера запускается без обработки. Нажмите «Включить фон Индер»,
  дождитесь загрузки и затем сделайте фото.
</div>

<script>
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const bgBtn = document.getElementById("bgBtn");
  const captureBtn = document.getElementById("captureBtn");
  const saveBtn = document.getElementById("saveBtn");
  const switchBtn = document.getElementById("switchBtn");
  const statusEl = document.getElementById("status");

  let stream = null;
  let facingMode = "user";
  let segmentationEnabled = false;
  let selfieSegmentation = null;
  let photoData = null;
  let processing = false;

  const bgImage = new Image();
  bgImage.src = "inder_bg.png";

  function setStatus(text) {
    statusEl.textContent = text;
  }

  async function startCamera() {
    try {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: facingMode,
          width: { ideal: 720 },
          height: { ideal: 1280 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      if (facingMode === "user") {
        video.style.transform = "scaleX(-1)";
      } else {
        video.style.transform = "none";
      }

      setStatus("Камера готова.");

      requestAnimationFrame(processFrame);

    } catch (err) {
      console.error(err);
      setStatus("Не удалось открыть камеру.");
      alert("Разрешите доступ к камере в Safari.");
    }
  }

  async function initSegmentation() {
    if (selfieSegmentation) return;

    setStatus("Загружаем AR-фон...");

    selfieSegmentation = new SelfieSegmentation({
      locateFile: (file) =>
        `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });

    selfieSegmentation.setOptions({
      modelSelection: 0
    });

    selfieSegmentation.onResults(drawSegmentedFrame);

    setStatus("AR-фон готов.");
  }

  function drawCover(img, context, w, h) {
    const ir = img.width / img.height;
    const cr = w / h;

    let dw, dh, dx, dy;

    if (ir > cr) {
      dh = h;
      dw = h * ir;
      dx = (w - dw) / 2;
      dy = 0;
    } else {
      dw = w;
      dh = w / ir;
      dx = 0;
      dy = (h - dh) / 2;
    }

    context.drawImage(img, dx, dy, dw, dh);
  }

  function drawSegmentedFrame(results) {
    const w = canvas.width;
    const h = canvas.height;

    ctx.save();
    ctx.clearRect(0, 0, w, h);

    // Сначала фон
    drawCover(bgImage, ctx, w, h);

    // Потом маска человека
    ctx.globalCompositeOperation = "destination-in";
    ctx.drawImage(results.segmentationMask, 0, 0, w, h);

    // Человек
    ctx.globalCompositeOperation = "source-over";

    if (facingMode === "user") {
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(results.image, 0, 0, w, h);
    } else {
      ctx.drawImage(results.image, 0, 0, w, h);
    }

    ctx.restore();
    processing = false;
  }

  async function processFrame() {
    if (
      segmentationEnabled &&
      selfieSegmentation &&
      !processing &&
      video.readyState >= 2
    ) {
      processing = true;

      try {
        await selfieSegmentation.send({ image: video });
      } catch (e) {
        console.error(e);
        processing = false;
      }
    }

    requestAnimationFrame(processFrame);
  }

  bgBtn.addEventListener("click", async () => {
    if (!segmentationEnabled) {
      await initSegmentation();

      segmentationEnabled = true;
      video.style.display = "none";
      canvas.style.display = "block";

      bgBtn.textContent = "✖ Выключить фон";
      setStatus("Фон Индер включён.");
    } else {
      segmentationEnabled = false;
      canvas.style.display = "none";
      video.style.display = "block";

      bgBtn.textContent = "🏞 Включить фон Индер";
      setStatus("Обычная камера.");
    }
  });

  captureBtn.addEventListener("click", () => {
    const w = canvas.width;
    const h = canvas.height;

    const finalCanvas = document.createElement("canvas");
    finalCanvas.width = w;
    finalCanvas.height = h;

    const fctx = finalCanvas.getContext("2d");

    if (segmentationEnabled) {
      fctx.drawImage(canvas, 0, 0, w, h);
    } else {
      if (facingMode === "user") {
        fctx.translate(w, 0);
        fctx.scale(-1, 1);
      }

      fctx.drawImage(video, 0, 0, w, h);
    }

    // Верхняя надпись
    fctx.fillStyle = "rgba(255,255,255,0.9)";
    fctx.fillRect(120, 45, 480, 75);

    fctx.fillStyle = "#111827";
    fctx.font = "bold 34px Arial";
    fctx.textAlign = "center";
    fctx.fillText("ИНДЕР · ТҰЗДЫКӨЛ", w/2, 95);

    // Нижняя надпись
    fctx.fillStyle = "rgba(15,23,42,0.82)";
    fctx.fillRect(200, 1155, 320, 60);

    fctx.fillStyle = "#fff";
    fctx.font = "bold 25px Arial";
    fctx.fillText("Zerde AR Project", w/2, 1195);

    photoData = finalCanvas.toDataURL("image/png");
    saveBtn.disabled = false;

    setStatus("Фото готово.");
  });

  saveBtn.addEventListener("click", () => {
    if (!photoData) return;

    const link = document.createElement("a");
    link.href = photoData;
    link.download = "inder-photo.png";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  switchBtn.addEventListener("click", async () => {
    facingMode = facingMode === "user" ? "environment" : "user";

    segmentationEnabled = false;
    canvas.style.display = "none";
    video.style.display = "block";
    bgBtn.textContent = "🏞 Включить фон Индер";

    await startCamera();
  });

  startCamera();
</script>

</body>
</html>
