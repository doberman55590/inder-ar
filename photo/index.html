<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Фото на Индере</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    header {
      padding: 14px 12px 10px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .subtitle {
      margin-top: 6px;
      font-size: 15px;
      opacity: 0.85;
    }

    .stage-wrap {
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .stage {
      position: relative;
      width: 100%;
      max-width: 430px;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 22px;
      background: #111;
      box-shadow: 0 12px 30px rgba(0,0,0,.35);
    }

    video,
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video {
      transform: scaleX(-1);
    }

    canvas {
      display: none;
    }

    .top-label {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.88);
      color: #111827;
      padding: 10px 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 18px;
      white-space: nowrap;
      z-index: 5;
    }

    .bottom-label {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,42,.80);
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      z-index: 5;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      padding: 16px 12px 22px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      min-width: 150px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .status {
      min-height: 20px;
      margin-top: 5px;
      color: #93c5fd;
      font-size: 14px;
    }

    .note {
      max-width: 500px;
      margin: 0 auto 24px;
      padding: 0 16px;
      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<header>
  <h1>Фото на Индере</h1>
  <div class="subtitle">Сделайте фото для Zerde</div>
  <div class="status" id="status">Запускаем камеру...</div>
</header>

<div class="stage-wrap">
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" width="1080" height="1920"></canvas>

    <div class="top-label">ИНДЕР · ТҰЗДЫКӨЛ</div>
    <div class="bottom-label">Zerde AR Project</div>
  </div>
</div>

<div class="controls">
  <button class="primary" id="captureBtn">📸 Сделать фото</button>
  <button class="success" id="saveBtn" disabled>⬇ Сохранить фото</button>
  <button class="secondary" id="switchBtn">🔄 Сменить камеру</button>
</div>

<div class="note">
  Разрешите доступ к камере, встаньте в кадр и нажмите «Сделать фото».
</div>

<script>
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const captureBtn = document.getElementById("captureBtn");
  const saveBtn = document.getElementById("saveBtn");
  const switchBtn = document.getElementById("switchBtn");
  const statusEl = document.getElementById("status");

  let stream = null;
  let facingMode = "user";
  let photoData = null;

  function setStatus(text) {
    statusEl.textContent = text;
  }

  async function startCamera() {
    try {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      setStatus("Запускаем камеру...");

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: facingMode,
          width: { ideal: 1080 },
          height: { ideal: 1920 }
        },
        audio: false
      });

      video.srcObject = stream;

      await video.play();

      if (facingMode === "user") {
        video.style.transform = "scaleX(-1)";
      } else {
        video.style.transform = "none";
      }

      setStatus("Камера готова.");
    } catch (err) {
      console.error(err);
      setStatus("Не удалось открыть камеру.");
      alert("Разрешите доступ к камере в Safari.");
    }
  }

  captureBtn.addEventListener("click", () => {
    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);

    const vw = video.videoWidth;
    const vh = video.videoHeight;

    const videoRatio = vw / vh;
    const canvasRatio = w / h;

    let sx, sy, sw, sh;

    if (videoRatio > canvasRatio) {
      sh = vh;
      sw = vh * canvasRatio;
      sx = (vw - sw) / 2;
      sy = 0;
    } else {
      sw = vw;
      sh = vw / canvasRatio;
      sx = 0;
      sy = (vh - sh) / 2;
    }

    ctx.save();

    if (facingMode === "user") {
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
    }

    ctx.drawImage(
      video,
      sx, sy, sw, sh,
      0, 0, w, h
    );

    ctx.restore();

    // Верхняя подпись
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillRect(185, 70, 710, 110);

    ctx.fillStyle = "#111827";
    ctx.font = "bold 48px Arial";
    ctx.textAlign = "center";
    ctx.fillText("ИНДЕР · ТҰЗДЫКӨЛ", w / 2, 140);

    // Нижняя подпись
    ctx.fillStyle = "rgba(15,23,42,0.82)";
    ctx.fillRect(300, 1690, 480, 90);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 36px Arial";
    ctx.fillText("Zerde AR Project", w / 2, 1750);

    photoData = canvas.toDataURL("image/png");

    saveBtn.disabled = false;
    setStatus("Фото готово.");
  });

  saveBtn.addEventListener("click", () => {
    if (!photoData) return;

    const link = document.createElement("a");
    link.href = photoData;
    link.download = "inder-photo.png";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  switchBtn.addEventListener("click", async () => {
    facingMode = facingMode === "user" ? "environment" : "user";
    await startCamera();
  });

  startCamera();
</script>

</body>
</html>
