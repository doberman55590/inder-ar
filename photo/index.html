<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Диагностика AR-фона</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 16px 10px 8px;
    }

    .statusBox {
      max-width: 430px;
      margin: 0 auto 12px;
      padding: 12px;
      background: #1e293b;
      border-radius: 14px;
      text-align: left;
      font-size: 14px;
      line-height: 1.5;
    }

    .ok { color: #86efac; }
    .wait { color: #fde68a; }
    .bad { color: #fca5a5; }

    .stage {
      width: calc(100% - 20px);
      max-width: 430px;
      aspect-ratio: 9 / 16;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: black;
    }

    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video {
      transform: scaleX(-1);
    }

    canvas {
      display: none;
    }

    button {
      margin: 14px 6px;
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #bgBtn {
      background: #f59e0b;
      color: #111827;
    }

    #resetBtn {
      background: #e5e7eb;
      color: #111827;
    }
  </style>
</head>

<body>

<h1>Диагностика AR-фона</h1>

<div class="statusBox" id="log">
  <div id="s1" class="wait">1. Камера: ожидание</div>
  <div id="s2" class="wait">2. Фон: ожидание</div>
  <div id="s3" class="wait">3. MediaPipe: ожидание</div>
  <div id="s4" class="wait">4. Модель: ожидание</div>
  <div id="s5" class="wait">5. Первый кадр: ожидание</div>
</div>

<div class="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas" width="720" height="1280"></canvas>
</div>

<button id="bgBtn">Включить фон Индер</button>
<button id="resetBtn">Перезапустить</button>

<script>
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const bgBtn = document.getElementById("bgBtn");
  const resetBtn = document.getElementById("resetBtn");

  const bgImage = new Image();
  bgImage.src = "inder_bg.png";

  let stream = null;
  let selfieSegmentation = null;
  let segmentationEnabled = false;
  let frameLoopStarted = false;
  let processing = false;

  function setStep(id, text, state) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = state;
  }

  function drawCover(img, context, w, h) {
    const ir = img.width / img.height;
    const cr = w / h;

    let dw, dh, dx, dy;

    if (ir > cr) {
      dh = h;
      dw = h * ir;
      dx = (w - dw) / 2;
      dy = 0;
    } else {
      dw = w;
      dh = w / ir;
      dx = 0;
      dy = (h - dh) / 2;
    }

    context.drawImage(img, dx, dy, dw, dh);
  }

  async function startCamera() {
    try {
      setStep("s1", "1. Камера: запускается...", "wait");

      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 720 },
          height: { ideal: 1280 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      setStep("s1", "1. Камера: OK", "ok");

    } catch (err) {
      console.error(err);
      setStep("s1", "1. Камера: ОШИБКА", "bad");
    }
  }

  bgImage.onload = () => {
    setStep("s2", "2. Фон: OK", "ok");
  };

  bgImage.onerror = () => {
    setStep("s2", "2. Фон: ОШИБКА загрузки", "bad");
  };

  async function initSegmentation() {
    try {
      setStep("s3", "3. MediaPipe: создаём...", "wait");

      if (typeof SelfieSegmentation === "undefined") {
        setStep("s3", "3. MediaPipe: библиотека НЕ загрузилась", "bad");
        return false;
      }

      setStep("s3", "3. MediaPipe: библиотека OK", "ok");

      setStep("s4", "4. Модель: загружается...", "wait");

      selfieSegmentation = new SelfieSegmentation({
        locateFile: (file) => {
          return `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`;
        }
      });

      selfieSegmentation.setOptions({
        modelSelection: 0
      });

      selfieSegmentation.onResults(onResults);

      setStep("s4", "4. Модель: объект создан", "ok");

      return true;

    } catch (err) {
      console.error(err);
      setStep("s4", "4. Модель: ОШИБКА", "bad");
      return false;
    }
  }

  function onResults(results) {
    setStep("s5", "5. Первый кадр: OK", "ok");

    const w = canvas.width;
    const h = canvas.height;

    ctx.clearRect(0, 0, w, h);

    // Фон
    drawCover(bgImage, ctx, w, h);

    // Маска
    ctx.save();

    ctx.globalCompositeOperation = "destination-in";
    ctx.drawImage(results.segmentationMask, 0, 0, w, h);

    ctx.globalCompositeOperation = "source-over";

    ctx.translate(w, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(results.image, 0, 0, w, h);

    ctx.restore();

    processing = false;
  }

  async function frameLoop() {
    if (!segmentationEnabled || !selfieSegmentation) return;

    if (!processing && video.readyState >= 2) {
      processing = true;

      try {
        await selfieSegmentation.send({ image: video });
      } catch (err) {
        console.error(err);
        processing = false;
        setStep("s5", "5. Первый кадр: ОШИБКА", "bad");
      }
    }

    requestAnimationFrame(frameLoop);
  }

  bgBtn.addEventListener("click", async () => {
    segmentationEnabled = true;

    const ok = await initSegmentation();

    if (!ok) return;

    canvas.style.display = "block";
    video.style.display = "none";

    setStep("s5", "5. Первый кадр: ждём...", "wait");

    if (!frameLoopStarted) {
      frameLoopStarted = true;
      frameLoop();
    }
  });

  resetBtn.addEventListener("click", () => {
    location.reload();
  });

  startCamera();
</script>

</body>
</html>
