<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Индер</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 5px;
    }

    p {
      margin: 5px 20px 15px;
    }

    model-viewer {
      width: 100%;
      height: 72vh;
      background: white;
    }

    .ar-button {
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 14px 24px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h1>Что находится под землёй?</h1>

<p>
AR-модель строения территории Индерского озера
</p>

<model-viewer
  src="inder_zerde_ar.glb"
  camera-controls
  auto-rotate
  autoplay
  ar
  ar-modes="webxr scene-viewer quick-look"
  shadow-intensity="1">

  <button slot="ar-button" class="ar-button">
    Посмотреть в AR
  </button>

</model-viewer>

</body>
</html>
